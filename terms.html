<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Terms of Sale — SmartHub</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="assets/mark.svg" type="image/svg+xml">
</head>
<body class="legal">
  <header class="top"><div class="wrap top-inner">
    <a class="brand" href="/"><div class="brand-mark"><span>SH</span></div>
    <div class="brand-text"><b>SmartHub</b><small>by visualbuild.local</small></div></a>
    <a class="btn btn-ghost btn-sm" href="/" data-en="← Back" data-zh="← 返回">← Back</a>
  </div></header>
  <main class="wrap">
    <h1 data-en="Terms of Sale" data-zh="销售条款">Terms of Sale</h1>
    <p data-en="Our full terms of sale — including shipping and warranty — will be published here before SmartHub goes on sale." data-zh="完整销售条款（包括配送与保修）将在 SmartHub 开售前发布在这里。">Our full terms of sale — including shipping and warranty — will be published here before SmartHub goes on sale.</p>
    <p><a class="btn btn-primary" href="/" data-en="Back to SmartHub" data-zh="返回 SmartHub">Back to SmartHub</a></p>
  </main>
  <script>
    (function(){
      var zh = (localStorage.getItem('smarthub_lang')||'').startsWith('zh');
      document.documentElement.lang = zh ? 'zh-Hans' : 'en';
      document.querySelectorAll('[data-en]').forEach(function(el){
        el.textContent = zh ? el.getAttribute('data-zh') : el.getAttribute('data-en');
      });
    })();
  </script>
</body>
</html>
