<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Refund & Return Policy — SmartHub</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="assets/mark.svg" type="image/svg+xml">
</head>
<body class="legal">
  <header class="top"><div class="wrap top-inner">
    <a class="brand" href="/"><div class="brand-mark"><span>SH</span></div>
    <div class="brand-text"><b>SmartHub</b><small>by visualbuild.local</small></div></a>
    <a class="btn btn-ghost btn-sm" href="/">← Back</a>
  </div></header>
  <main class="wrap">
    <h1 data-en="Refund & Return Policy" data-zh="退换货政策">Refund & Return Policy</h1>
    <p data-en="Launch placeholder. Publish final cancellation, return, refund and defective-product terms before accepting orders." data-zh="上线占位。正式接单前请发布最终取消、退货、退款与瑕疵品条款。">Launch placeholder. Publish final cancellation, return, refund and defective-product terms before accepting orders.</p>
    <p><a class="btn btn-primary" href="/">Back to SmartHub</a></p>
  </main>
  <script>
    (function(){
      var zh = (localStorage.getItem('smarthub_lang')||'').startsWith('zh');
      document.documentElement.lang = zh ? 'zh-Hans' : 'en';
      document.querySelectorAll('[data-en]').forEach(function(el){
        el.textContent = zh ? el.getAttribute('data-zh') : el.getAttribute('data-en');
      });
    })();
  </script>
</body>
</html>
